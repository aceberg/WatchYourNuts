project_name: WatchYourNuts
builds:
  - main: ./cmd/WatchYourNuts/
    binary: WatchYourNuts
    id: default
    env: [CGO_ENABLED=0]
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - windows
      - darwin
      - android
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    goarm:
      - "5"
      - "6"
      - "7"
    ignore:
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: 386
      - goos: windows
        goarch: arm
      - goos: android
        goarch: 386
      - goos: android
        goarch: amd64
      - goos: android
        goarch: arm

nfpms:
  - maintainer: aceberg <aceberg_a@proton.me>
    description: WatchYourNuts (aka Nutrients) - self-hosted calorie tracker
    homepage: https://github.com/aceberg/WatchYourNuts
    license: MIT
    section: utils
    formats:
    - deb
    - rpm
    - apk
    - termux.deb
    contents:
    - src: ./configs/WatchYourNuts.service
      dst: /lib/systemd/system/WatchYourNuts.service
    - src: ./configs/WatchYourNuts@.service
      dst: /lib/systemd/system/WatchYourNuts@.service
    scripts:
      postinstall: ./configs/postinstall.sh

archives:
  - files:
    - LICENSE
    - src: ./configs/WatchYourNuts.service
      dst: WatchYourNuts.service
    - src: ./configs/WatchYourNuts@.service
      dst: WatchYourNuts@.service
    - src: ./configs/install.sh
      dst: install.sh
    wrap_in_directory: true
    format_overrides:
    - goos: windows
      format: zip

checksum:
  name_template: "checksums.txt"
